# Render blueprint for the agent (New -> Blueprint -> pick this repo).
# Render asks for the two secret values below when the blueprint is created.
services:
  - type: web
    name: airquery-agent
    runtime: docker
    dockerfilePath: ./agent/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY # your Groq key; stays on Render, never in the website
        sync: false
      - key: WEB_ORIGIN # the site's origin, e.g. https://<your-user>.github.io
        sync: false
